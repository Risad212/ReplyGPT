<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#1f6b5a; --accent-soft:#e7f0ec; --bg:#f7f5f1; --panel:#ffffff;
    --ink:#1c2321; --muted:#6e7a75; --line:#e6e0d6; --err:#b4432e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#5fc2a8; --accent-soft:#233230; --bg:#141917; --panel:#1d2321;
      --ink:#e9ebe8; --muted:#92a39c; --line:#2b3431; --err:#ef8a75;
    }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
  }
  header {
    display:flex; align-items:center; gap:10px;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
  header .brand { font-size:15px; font-weight:600; letter-spacing:.1px; }
  header .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  header .sub { font-size:12.5px; color:var(--muted); }
  header select {
    font:inherit; font-size:12.5px; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; cursor:pointer;
  }
  .wrap { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .col { max-width:680px; margin:0 auto; padding:24px 20px 16px; display:flex; flex-direction:column; gap:14px; }
  .hello { padding:14vh 6px 24px; text-align:center; }
  .hello h1 { font-size:26px; font-weight:600; }
  .hello p { margin-top:8px; color:var(--muted); font-size:14.5px; line-height:1.55; }
  .msg {
    max-width:min(620px, 100%); padding:11px 15px; border-radius:16px;
    font-size:15px; line-height:1.6; white-space:pre-wrap; word-wrap:break-word;
    animation:rise .22s ease-out;
  }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .q { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
  .a { align-self:flex-start; background:var(--panel); border:1px solid var(--line); box-shadow:0 1px 2px rgb(0 0 0 / .04); border-bottom-left-radius:5px; }
  .src { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .src a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  .src .weak { color:var(--err); }
  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:9px; }
  .tools .copy {
    display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12.5px;
    color:var(--accent); background:var(--accent-soft); border:0; border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .fixbtn {
    font:inherit; font-size:12.5px; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .fixbtn:hover, .tools .fixbtn[aria-expanded="true"] { color:var(--accent); border-color:var(--accent); }
  .tools .savebtn {
    font:inherit; font-size:12.5px; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .savebtn:disabled { opacity:.45; cursor:progress; }
  .tools .note { font-size:12.5px; color:var(--accent); }
  .fixbox textarea {
    display:block; width:100%; min-height:110px; margin-top:9px; resize:vertical;
    font:inherit; font-size:14.5px; line-height:1.5; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
  }
  .fixbox textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .dots { display:inline-flex; gap:5px; padding:4px 2px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.4; animation:pulse 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity:.35; transform:none; } 30% { opacity:1; transform:translateY(-2px); } }
  .err { color:var(--err); }
  .msg.a p { margin:0 0 8px; }
  .msg.a p:last-child { margin-bottom:0; }
  .msg.a ul, .msg.a ol { margin:4px 0 8px 20px; padding:0; }
  .msg.a li { margin:3px 0; }
  .msg.a code {
    font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px;
    background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 5px;
  }
  button.send.stop { background:var(--ink); }
  .burger {
    background:none; border:0; cursor:pointer; font-size:18px; line-height:1;
    color:var(--ink); padding:6px 9px; border-radius:8px; margin-right:2px;
  }
  .burger:hover { background:var(--panel); }
  .scrim {
    position:fixed; inset:0; background:rgb(0 0 0/.35); opacity:0;
    pointer-events:none; transition:opacity .2s; z-index:29;
  }
  .scrim.open { opacity:1; pointer-events:auto; }
  .drawer {
    position:fixed; top:0; bottom:0; left:0; width:min(300px, 82vw); z-index:30;
    background:var(--panel); border-right:1px solid var(--line);
    transform:translateX(-103%); transition:transform .22s ease;
    display:flex; flex-direction:column; gap:10px; padding:14px;
  }
  .drawer.open { transform:none; }
  .drawer h2 {
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin:2px 2px 0; font-weight:600;
  }
  .newchat {
    font:inherit; font-size:14px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border:0; border-radius:10px;
    padding:9px 12px; cursor:pointer; text-align:left;
  }
  .newchat:hover { filter:brightness(1.04); }
  .chatlist { overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .chatitem { display:flex; align-items:center; gap:2px; }
  .chatitem .t {
    flex:1; min-width:0; text-align:left; font:inherit; font-size:13.5px; color:var(--ink);
    background:none; border:0; border-radius:8px; padding:8px 10px; cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chatitem .t:hover { background:var(--bg); }
  .chatitem .t.cur { color:var(--accent); background:var(--accent-soft); }
  .chatitem .x {
    visibility:hidden; background:none; border:0; color:var(--muted);
    cursor:pointer; font-size:14px; padding:4px 7px; border-radius:6px;
  }
  .chatitem:hover .x { visibility:visible; }
  .chatitem .x:hover { color:var(--err); }
  .composer { padding:8px 16px 0; }
  #f {
    display:flex; align-items:center; gap:6px; max-width:680px; margin:0 auto; width:100%;
    padding:6px 6px 6px 18px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); box-shadow:0 6px 18px rgb(0 0 0 / .07);
  }
  #f:focus-within { border-color:var(--accent); }
  #f input {
    flex:1; min-width:0; font:inherit; font-size:16px; padding:10px 0;
    background:transparent; border:0; color:var(--ink);
  }
  #f input::placeholder { color:var(--muted); }
  #f input:focus { outline:none; }
  button.send {
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    font:inherit; font-size:17px; font-weight:600; background:var(--accent); color:#fff; border:0;
    cursor:pointer; transition:opacity .15s;
  }
  button.send:disabled { opacity:.45; cursor:progress; }
  button.send:hover:not(:disabled) { filter:brightness(1.06); }
  .foot { text-align:center; font-size:11.5px; color:var(--muted); padding:10px 16px calc(14px + env(safe-area-inset-bottom)); }
  @media (max-width:760px) {
    .wrap { padding:0; } .col { padding:16px 14px 12px; gap:12px; }
    .hello { padding-top:9vh; }
  }
</style>
</head>
<body>
<header>
  <button class="burger" id="burger" aria-label="Chat history" title="Chat history">&#9776;</button>
  <span class="dot"></span><span class="brand">Ask Desk</span>
  <span class="right">
    <select id="tone" title="Reply tone">
      <option value="friendly">Friendly</option>
      <option value="formal">Formal</option>
    </select>
    <select id="plugin" hidden></select>
    <span class="sub" id="sub"></span>
  </span>
</header>
<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Saved chats">
  <button class="newchat" id="newchat">+ New chat</button>
  <h2>Recent</h2>
  <div class="chatlist" id="chatlist"></div>
</nav>
<div class="wrap"><div class="col" id="col">
  <div class="hello" id="hello">
    <h1>Ask anything.</h1>
    <p>Answers come from the team's own documents — nothing is invented.</p>
  </div>
</div></div>
<div class="composer">
  <form id="f">
    <input id="q" placeholder="Ask anything…" autocomplete="off" enterkeyhint="send" autofocus aria-label="Question">
    <button class="send" id="send" aria-label="Send" title="Send">&#8593;</button>
  </form>
  <div class="foot">Ask Desk can make mistakes — check important info before sending.</div>
</div>
<script>
const API = location.origin + "/api";
const LS_PLUGIN = "askdesk.plugin";
const LS_CHATS = "askdesk.chats";
const LS_CHAT = "askdesk.chat";
const $ = (id) => document.getElementById(id);
const col = $("col"), f = $("f"), q = $("q"), send = $("send"),
      pluginSel = $("plugin"), sub = $("sub"), toneSel = $("tone"),
      burger = $("burger"), drawer = $("drawer"), scrim = $("scrim"),
      chatlist = $("chatlist"), helloEl = $("hello");
let plugin = localStorage.getItem(LS_PLUGIN) || "";
let tone = localStorage.getItem("askdesk.tone") || "friendly";
toneSel.value = tone;
toneSel.onchange = () => { tone = toneSel.value; localStorage.setItem("askdesk.tone", tone); };
let lastQ = "";
let history = [];
const scroll = () => requestAnimationFrame(() => { col.parentElement.scrollTop = col.parentElement.scrollHeight; });

// ---------- saved chats (localStorage) ----------
const loadChats = () => { try { return JSON.parse(localStorage.getItem(LS_CHATS)) || []; } catch { return []; } };
const saveChats = (list) => localStorage.setItem(LS_CHATS, JSON.stringify(list.slice(0, 30)));
let curChat = localStorage.getItem(LS_CHAT) || "";

function renderChatList() {
  chatlist.replaceChildren();
  for (const c of loadChats()) {
    const item = document.createElement("div");
    item.className = "chatitem";
    const t = document.createElement("button");
    t.type = "button";
    t.className = "t" + (c.id === curChat ? " cur" : "");
    t.textContent = c.title;
    t.title = c.title;
    t.onclick = () => { openChat(c.id); closeDrawer(); };
    const x = document.createElement("button");
    x.type = "button";
    x.className = "x";
    x.textContent = "✕";
    x.setAttribute("aria-label", "Delete chat");
    x.onclick = () => deleteChat(c.id);
    item.append(t, x);
    chatlist.appendChild(item);
  }
}

function persistChat() {
  if (!history.length) return;
  const chats = loadChats();
  let c = chats.find((x) => x.id === curChat);
  if (!c) {
    c = { id: crypto.randomUUID(), title: history[0].content.slice(0, 60), updated: 0 };
    chats.unshift(c);
    curChat = c.id;
    localStorage.setItem(LS_CHAT, curChat);
  }
  c.msgs = history.slice();
  c.updated = Date.now();
  chats.sort((a, b) => b.updated - a.updated);
  saveChats(chats);
  renderChatList();
}

function openChat(id) {
  const c = loadChats().find((x) => x.id === id);
  if (!c) return;
  curChat = id;
  localStorage.setItem(LS_CHAT, id);
  history = (c.msgs || []).slice();
  col.replaceChildren();
  for (const m of history) {
    if (m.role === "user") add("q", m.content);
    else {
      const a = add("a", "");
      a.innerHTML = md(m.content);
    }
  }
  renderChatList();
  scroll();
}

function newChat() {
  curChat = "";
  localStorage.removeItem(LS_CHAT);
  history = [];
  col.replaceChildren(helloEl);
  renderChatList();
}

function deleteChat(id) {
  saveChats(loadChats().filter((c) => c.id !== id));
  if (curChat === id) newChat();
  else renderChatList();
}

const openDrawer = () => { drawer.classList.add("open"); scrim.classList.add("open"); };
const closeDrawer = () => { drawer.classList.remove("open"); scrim.classList.remove("open"); };
burger.onclick = openDrawer;
scrim.onclick = closeDrawer;

const headers = () => ({ "Content-Type": "application/json" });

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (text) d.textContent = text;
  col.appendChild(d);
  scroll();
  return d;
}

function typing() {
  const a = add("a", "");
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<i></i><i></i><i></i>";
  a.appendChild(dots);
  return a;
}

async function loadPlugins() {
  const r = await fetch(API + "/plugins", { headers: headers() });
  if (!r.ok) return "err";
  const j = await r.json().catch(() => ({}));
  const names = j.plugins || [];
  pluginSel.replaceChildren();
  if (!names.length) {
    plugin = "";
    sub.textContent = "All documents";
  } else if (names.length === 1) {
    plugin = names[0];
    sub.textContent = names[0];
  } else {
    for (const p of names) pluginSel.add(new Option(p, p));
    const saved = localStorage.getItem(LS_PLUGIN) || "";
    plugin = names.includes(saved) ? saved : names[0];
    pluginSel.value = plugin;
    pluginSel.hidden = false;
    sub.textContent = "";
  }
  localStorage.setItem(LS_PLUGIN, plugin);
  return "ok";
}

pluginSel.onchange = () => {
  plugin = pluginSel.value;
  localStorage.setItem(LS_PLUGIN, plugin);
  newChat();
};

// ---------- markdown (tiny, safe: escapes first) ----------
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function md(src) {
  const bold = (s) =>
    s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", ul = false, ol = false;
  const close = () => { if (ul) { out += "</ul>"; ul = false; } if (ol) { out += "</ol>"; ol = false; } };
  for (const raw of esc(src).split("\n")) {
    const line = raw.trim();
    let m;
    if (/^[-*] /.test(line)) {
      if (!ul) { close(); out += "<ul>"; ul = true; }
      out += "<li>" + bold(line.slice(2)) + "</li>";
    } else if ((m = line.match(/^\d+[.)] (.*)$/))) {
      if (!ol) { close(); out += "<ol>"; ol = true; }
      out += "<li>" + bold(m[1]) + "</li>";
    } else {
      close();
      if (line) out += "<p>" + bold(line) + "</p>";
    }
  }
  close();
  return out;
}

// ---------- ask (streaming) ----------
let streaming = false;
let ctrl = null;

function setStreamUI(on) {
  streaming = on;
  send.classList.toggle("stop", on);
  send.innerHTML = on ? "&#9632;" : "&#8593;";
  send.setAttribute("aria-label", on ? "Stop" : "Send");
  send.disabled = false;
}

f.onsubmit = async (e) => {
  e.preventDefault();
  if (streaming) { ctrl.abort(); return; }
  const question = q.value.trim();
  if (!question) return;
  q.value = "";
  lastQ = question;
  add("q", question);
  setStreamUI(true);
  const a = typing();
  let holder = { text: "" };
  let meta = null;
  let stopped = false;
  ctrl = new AbortController();
  try {
    const r = await fetch(API + "/ask/stream", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ question, plugin, asReply: true, tone, history }),
      signal: ctrl.signal,
    });
    if (!r.ok || !r.body) {
      const j = await r.json().catch(() => ({}));
      throw new Error((j && j.error) || "Something went wrong (" + r.status + ").");
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let started = false;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop() || "";
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const ev = JSON.parse(line.slice(5));
        if (ev.type === "meta") {
          meta = ev;
        } else if (ev.type === "delta") {
          if (!started) { a.replaceChildren(); started = true; }
          holder.text += ev.text;
          a.innerHTML = md(holder.text);
          scroll();
        } else if (ev.type === "corrected") {
          holder.text = ev.text;
          a.innerHTML = md(holder.text);
          scroll();
        } else if (ev.type === "error") {
          throw new Error(ev.message);
        }
      }
    }
  } catch (err) {
    if (err && err.name === "AbortError") stopped = true;
    else {
      if (!holder.text) {
        a.textContent = (err && err.message) || "Network error — check the connection.";
        a.classList.add("err");
      } else {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = (err && err.message) || "Stream interrupted.";
        a.appendChild(s);
      }
    }
  }
  if (holder.text) {
    a.innerHTML = md(holder.text);
    holder.text = holder.text.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
    history.push({ role: "user", content: question }, { role: "assistant", content: holder.text });
    history = history.slice(-24);
    persistChat();
    const list = (meta && meta.sources) || [];
    if (list.length) {
      const s = document.createElement("div");
      s.className = "src";
      s.append("Sources: ");
      list.forEach((x, i) => {
        if (i) s.append(" · ");
        const label = (x.n ? x.n + ". " : "") + x.title + (x.plugin ? " — " + x.plugin : "");
        if (x.source_url) {
          const link = document.createElement("a");
          link.href = x.source_url;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = label;
          s.appendChild(link);
        } else {
          s.append(label);
        }
      });
      if (meta && meta.confidence === "low") {
        const w = document.createElement("span");
        w.className = "weak";
        w.textContent = " · weak match — double-check";
        s.appendChild(w);
      }
      a.appendChild(s);
      addTools(a, question, holder, s);
    } else {
      addTools(a, question, holder, null);
    }
  } else if (stopped) {
    a.textContent = "Stopped.";
  }
  setStreamUI(false);
  ctrl = null;
  q.focus();
  scroll();
};

function addTools(a, question, holder, srcEl) {
  const tools = document.createElement("div");
  tools.className = "tools";

  const copy = document.createElement("button");
  copy.className = "copy";
  copy.type = "button";
  copy.textContent = "Copy reply";
  copy.onclick = () => {
    navigator.clipboard.writeText(holder.text);
    copy.textContent = "Copied ✓";
    setTimeout(() => (copy.textContent = "Copy reply"), 1300);
  };
  tools.appendChild(copy);

  const fixbtn = document.createElement("button");
  fixbtn.className = "fixbtn";
  fixbtn.type = "button";
  fixbtn.setAttribute("aria-expanded", "false");
  fixbtn.textContent = "Correct it";
  tools.appendChild(fixbtn);

  const fixbox = document.createElement("div");
  fixbox.className = "fixbox";
  fixbox.hidden = true;
  fixbtn.onclick = () => {
    fixbox.hidden = !fixbox.hidden;
    fixbtn.setAttribute("aria-expanded", String(!fixbox.hidden));
    if (!fixbox.hidden) {
      ta.value = holder.text;
      ta.focus();
    }
  };

  const ta = document.createElement("textarea");
  ta.placeholder = "Edit the reply, then save. The corrected answer will be remembered.";

  const save = document.createElement("button");
  save.className = "savebtn";
  save.type = "button";
  save.textContent = "Save correction";
  save.onclick = async () => {
    const answer = ta.value.trim();
    if (!answer) return;
    save.disabled = true;
    try {
      const r = await fetch(API + "/learn", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ question: lastQ || question, answer, plugin }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.id) {
        for (let i = history.length - 1; i >= 0; i--) {
          if (history[i].role === "assistant" && history[i].content === holder.text) {
            history[i].content = answer;
            break;
          }
        }
        holder.text = answer;
        fixbox.remove();
        fixbtn.remove();
        note.textContent = "Saved. This reply is now remembered.";
        const keep = [document.createTextNode(answer)];
        if (srcEl) keep.push(srcEl);
        keep.push(tools);
        a.replaceChildren(...keep);
      } else {
        note.textContent = (j && j.error) || "Could not save (" + r.status + ").";
      }
    } catch {
      note.textContent = "Network error — try again.";
    }
    save.disabled = false;
  };

  const note = document.createElement("span");
  note.className = "note";
  tools.appendChild(note);

  fixbox.appendChild(ta);
  fixbox.appendChild(save);
  a.appendChild(tools);
  a.appendChild(fixbox);
  scroll();
}

// boot: open the chat straight away; if the API is not reachable, show an inline notice
(async () => {
  try {
    const res = await loadPlugins();
    if (res !== "ok") add("a err", "Could not reach the server. The API is not live yet — try again in a minute.");
  } catch {
    add("a err", "Network error — check the connection and try again.");
  }
  renderChatList();
  if (curChat && loadChats().some((c) => c.id === curChat)) openChat(curChat);
})();
</script>
</body>
</html>
