<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:#1f6b5a; --accent-soft:#e7f0ec; --bg:#f7f5f1; --panel:#ffffff;
    --ink:#1c2321; --muted:#6e7a75; --line:#e6e0d6; --err:#b4432e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent:#5fc2a8; --accent-soft:#233230; --bg:#141917; --panel:#1d2321;
      --ink:#e9ebe8; --muted:#92a39c; --line:#2b3431; --err:#ef8a75;
    }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
  }
  header {
    display:flex; align-items:center; gap:10px;
    padding:14px 20px; border-bottom:1px solid var(--line);
  }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
  header .brand { font-size:15px; font-weight:600; letter-spacing:.1px; }
  header .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
  header .sub { font-size:12.5px; color:var(--muted); }
  header select {
    font:inherit; font-size:12.5px; color:var(--ink);
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:4px 10px; cursor:pointer;
  }
  .wrap { flex:1; overflow-y:auto; scroll-behavior:smooth; }
  .col { max-width:680px; margin:0 auto; padding:24px 20px 16px; display:flex; flex-direction:column; gap:14px; }
  .hello { padding:14vh 6px 24px; text-align:center; }
  .hello h1 { font-size:26px; font-weight:600; }
  .hello p { margin-top:8px; color:var(--muted); font-size:14.5px; line-height:1.55; }
  .msg {
    max-width:min(620px, 100%); padding:11px 15px; border-radius:16px;
    font-size:15px; line-height:1.6; white-space:pre-wrap; word-wrap:break-word;
    animation:rise .22s ease-out;
  }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .q { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
  .a { align-self:flex-start; background:var(--panel); border:1px solid var(--line); box-shadow:0 1px 2px rgb(0 0 0 / .04); border-bottom-left-radius:5px; }
  .src { margin-top:8px; font-size:12.5px; color:var(--muted); }
  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:9px; }
  .tools .copy {
    display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12.5px;
    color:var(--accent); background:var(--accent-soft); border:0; border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .fixbtn {
    font:inherit; font-size:12.5px; color:var(--muted); background:none;
    border:1px solid var(--line); border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .fixbtn:hover, .tools .fixbtn[aria-expanded="true"] { color:var(--accent); border-color:var(--accent); }
  .tools .savebtn {
    font:inherit; font-size:12.5px; font-weight:600; color:#fff;
    background:var(--accent); border:0; border-radius:8px; padding:4px 11px; cursor:pointer;
  }
  .tools .savebtn:disabled { opacity:.45; cursor:progress; }
  .tools .note { font-size:12.5px; color:var(--accent); }
  .fixbox textarea {
    display:block; width:100%; min-height:110px; margin-top:9px; resize:vertical;
    font:inherit; font-size:14.5px; line-height:1.5; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink);
  }
  .fixbox textarea:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .dots { display:inline-flex; gap:5px; padding:4px 2px; }
  .dots i { width:6px; height:6px; border-radius:50%; background:var(--muted); opacity:.4; animation:pulse 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity:.35; transform:none; } 30% { opacity:1; transform:translateY(-2px); } }
  .err { color:var(--err); }
  .composer { padding:8px 16px 0; }
  #f {
    display:flex; align-items:center; gap:6px; max-width:680px; margin:0 auto; width:100%;
    padding:6px 6px 6px 18px; border:1px solid var(--line); border-radius:999px;
    background:var(--panel); box-shadow:0 6px 18px rgb(0 0 0 / .07);
  }
  #f:focus-within { border-color:var(--accent); }
  #f input {
    flex:1; min-width:0; font:inherit; font-size:16px; padding:10px 0;
    background:transparent; border:0; color:var(--ink);
  }
  #f input::placeholder { color:var(--muted); }
  #f input:focus { outline:none; }
  button.send {
    flex:0 0 auto; width:42px; height:42px; border-radius:50%;
    font:inherit; font-size:17px; font-weight:600; background:var(--accent); color:#fff; border:0;
    cursor:pointer; transition:opacity .15s;
  }
  button.send:disabled { opacity:.45; cursor:progress; }
  button.send:hover:not(:disabled) { filter:brightness(1.06); }
  .foot { text-align:center; font-size:11.5px; color:var(--muted); padding:10px 16px calc(14px + env(safe-area-inset-bottom)); }
  @media (max-width:760px) {
    .wrap { padding:0; } .col { padding:16px 14px 12px; gap:12px; }
    .hello { padding-top:9vh; }
  }
</style>
</head>
<body>
<header>
  <span class="dot"></span><span class="brand">Ask Desk</span>
  <span class="right">
    <select id="plugin" hidden></select>
    <span class="sub" id="sub"></span>
  </span>
</header>
<div class="wrap"><div class="col" id="col">
  <div class="hello">
    <h1>Ask anything.</h1>
    <p>Answers come from the team's own documents — nothing is invented.</p>
  </div>
</div></div>
<div class="composer">
  <form id="f">
    <input id="q" placeholder="Ask anything…" autocomplete="off" enterkeyhint="send" autofocus aria-label="Question">
    <button class="send" id="send" aria-label="Send" title="Send">&#8593;</button>
  </form>
  <div class="foot">Ask Desk can make mistakes — check important info before sending.</div>
</div>
<script>
const API = location.origin + "/api";
const LS_PLUGIN = "askdesk.plugin";
const $ = (id) => document.getElementById(id);
const col = $("col"), f = $("f"), q = $("q"), send = $("send"),
      pluginSel = $("plugin"), sub = $("sub");
let plugin = localStorage.getItem(LS_PLUGIN) || "";
let lastQ = "";
const scroll = () => requestAnimationFrame(() => { col.parentElement.scrollTop = col.parentElement.scrollHeight; });

const headers = () => ({ "Content-Type": "application/json" });

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (text) d.textContent = text;
  col.appendChild(d);
  scroll();
  return d;
}

function typing() {
  const a = add("a", "");
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<i></i><i></i><i></i>";
  a.appendChild(dots);
  return a;
}

async function loadPlugins() {
  const r = await fetch(API + "/plugins", { headers: headers() });
  if (!r.ok) return "err";
  const j = await r.json().catch(() => ({}));
  const names = j.plugins || [];
  pluginSel.replaceChildren();
  if (!names.length) {
    plugin = "";
    sub.textContent = "All documents";
  } else if (names.length === 1) {
    plugin = names[0];
    sub.textContent = names[0];
  } else {
    for (const p of names) pluginSel.add(new Option(p, p));
    const saved = localStorage.getItem(LS_PLUGIN) || "";
    plugin = names.includes(saved) ? saved : names[0];
    pluginSel.value = plugin;
    pluginSel.hidden = false;
    sub.textContent = "";
  }
  localStorage.setItem(LS_PLUGIN, plugin);
  return "ok";
}

pluginSel.onchange = () => {
  plugin = pluginSel.value;
  localStorage.setItem(LS_PLUGIN, plugin);
};

// ---------- ask ----------
f.onsubmit = async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  q.value = "";
  lastQ = question;
  add("q", question);
  send.disabled = true;
  const a = typing();
  let holder = { text: "" };
  try {
    const r = await fetch(API + "/ask", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ question, plugin, asReply: true }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.answer) {
      holder.text = j.answer;
      a.replaceChildren(document.createTextNode(j.answer));
      if (j.sources && j.sources.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = "Sources: " + j.sources.map((x) => x.title + (x.plugin ? " — " + x.plugin : "")).join(" · ");
        a.appendChild(s);
        addTools(a, question, holder, s);
      } else {
        addTools(a, question, holder, null);
      }
    } else {
      a.textContent = (j && j.error) || "Something went wrong (" + r.status + ").";
      a.classList.add("err");
    }
  } catch {
    a.textContent = "Network error — check the connection.";
    a.classList.add("err");
  }
  send.disabled = false;
  q.focus();
  scroll();
};

function addTools(a, question, holder, srcEl) {
  const tools = document.createElement("div");
  tools.className = "tools";

  const copy = document.createElement("button");
  copy.className = "copy";
  copy.type = "button";
  copy.textContent = "Copy reply";
  copy.onclick = () => {
    navigator.clipboard.writeText(holder.text);
    copy.textContent = "Copied ✓";
    setTimeout(() => (copy.textContent = "Copy reply"), 1300);
  };
  tools.appendChild(copy);

  const fixbtn = document.createElement("button");
  fixbtn.className = "fixbtn";
  fixbtn.type = "button";
  fixbtn.setAttribute("aria-expanded", "false");
  fixbtn.textContent = "Correct it";
  tools.appendChild(fixbtn);

  const fixbox = document.createElement("div");
  fixbox.className = "fixbox";
  fixbox.hidden = true;
  fixbtn.onclick = () => {
    fixbox.hidden = !fixbox.hidden;
    fixbtn.setAttribute("aria-expanded", String(!fixbox.hidden));
    if (!fixbox.hidden) {
      ta.value = holder.text;
      ta.focus();
    }
  };

  const ta = document.createElement("textarea");
  ta.placeholder = "Edit the reply, then save. The corrected answer will be remembered.";

  const save = document.createElement("button");
  save.className = "savebtn";
  save.type = "button";
  save.textContent = "Save correction";
  save.onclick = async () => {
    const answer = ta.value.trim();
    if (!answer) return;
    save.disabled = true;
    try {
      const r = await fetch(API + "/learn", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ question: lastQ || question, answer, plugin }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.id) {
        holder.text = answer;
        fixbox.remove();
        fixbtn.remove();
        note.textContent = "Saved. This reply is now remembered.";
        const keep = [document.createTextNode(answer)];
        if (srcEl) keep.push(srcEl);
        keep.push(tools);
        a.replaceChildren(...keep);
      } else {
        note.textContent = (j && j.error) || "Could not save (" + r.status + ").";
      }
    } catch {
      note.textContent = "Network error — try again.";
    }
    save.disabled = false;
  };

  const note = document.createElement("span");
  note.className = "note";
  tools.appendChild(note);

  fixbox.appendChild(ta);
  fixbox.appendChild(save);
  a.appendChild(tools);
  a.appendChild(fixbox);
  scroll();
}

// boot: open the chat straight away; if the API is not reachable, show an inline notice
(async () => {
  try {
    const res = await loadPlugins();
    if (res !== "ok") add("a err", "Could not reach the server. The API is not live yet — try again in a minute.");
  } catch {
    add("a err", "Network error — check the connection and try again.");
  }
})();
</script>
</body>
</html>
