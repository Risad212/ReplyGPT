<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f4f5f2; --panel: #ffffff; --ink: #1c2325; --muted: #5d696c; --line: #d9ddd8;
  --accent: #1f6b5a; --accent-ink: #ffffff; --accent-soft: #e0eee9; --user: #e9ecef; --warn: #8a5a00;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a1b; --panel: #1b2325; --ink: #e5ebe9; --muted: #98a6a4; --line: #2c3739;
    --accent: #5fc2a8; --accent-ink: #0d1a17; --accent-soft: #20332f; --user: #243033; --warn: #e0b45a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a1b; --panel: #1b2325; --ink: #e5ebe9; --muted: #98a6a4; --line: #2c3739;
  --accent: #5fc2a8; --accent-ink: #0d1a17; --accent-soft: #20332f; --user: #243033; --warn: #e0b45a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
}
.app { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 6px; font-size: 13px; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
.rail summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.rail summary::-webkit-details-marker { display: none; }
.rail-body { margin-top: 12px; display: flex; flex-direction: column; gap: 14px; }
.sect { display: flex; flex-direction: column; gap: 6px; }
.doc { border-top: 1px solid var(--line); padding-top: 8px; display: flex; gap: 8px; justify-content: space-between; align-items: flex-start; }
.doc:first-child { border-top: 0; padding-top: 0; }
.doc b { font-weight: 500; display: block; overflow-wrap: anywhere; }
.doc small { font-family: var(--font-mono); color: var(--muted); font-size: 11px; }
.doclist { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
input[type=text], input[type=password], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
}
select { width: auto; max-width: 100%; background: var(--panel); }
textarea { resize: vertical; min-height: 84px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
button.link { border: 0; background: none; color: var(--muted); padding: 2px 4px; font-size: 12px; text-align: left; }
button.link:hover { color: var(--ink); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file span { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; background: var(--panel); }
.file input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chat { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.log { display: flex; flex-direction: column; gap: 14px; }
.msg.q { align-self: flex-end; background: var(--user); border-radius: 8px; padding: 8px 12px; max-width: 85%; overflow-wrap: anywhere; }
.msg.a { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.msg.a .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.a .body.pending { color: var(--muted); }
.msg.a .body.err { color: var(--warn); }
.srcs { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-family: var(--font-mono); font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 4px; overflow-wrap: anywhere; }
.chip.gen { background: var(--user); color: var(--muted); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.suggest button { font-size: 13px; text-align: left; }
.ask { display: flex; gap: 8px; position: sticky; bottom: 0; padding: 10px 0 2px; background: var(--bg); }
.ask input { flex: 1; min-width: 0; }
.gate { max-width: 380px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.gate p { margin: 0; }
.err-text { color: var(--warn); font-size: 13px; min-height: 1.2em; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<form class="gate" id="gate" hidden>
  <h1>Ask Desk</h1>
  <p class="sub">Enter the team access key to continue.</p>
  <label class="label" for="keyin">Access key</label>
  <input type="password" id="keyin" autocomplete="current-password">
  <div class="err-text" id="gateerr" role="alert"></div>
  <button class="primary" type="submit">Continue</button>
</form>

<main class="app" id="app" hidden>
  <details class="rail" id="rail" open>
    <summary><span class="label">Sources</span><span class="hint" id="count"></span></summary>
    <div class="rail-body">
      <div class="sect"><span class="label">Most asked</span><div id="top"></div></div>
      <div class="sect"><span class="label">Not answered yet</span><div id="unans"></div></div>
      <div class="sect"><span class="label">Documents</span><div class="doclist" id="docs"></div></div>
      <div class="sect">
        <label class="label" for="prodin">Adding to plugin</label>
        <input type="text" id="prodin" list="prodlist" placeholder="Plugin name (blank = shared by all)">
        <datalist id="prodlist"></datalist>
        <div class="row">
          <label class="file"><input type="file" id="file" multiple accept=".txt,.md,.csv,.json,.html,text/*"><span>Add files</span></label>
        </div>
        <p class="hint">Text, Markdown, CSV and JSON files. Saved under the plugin name above.</p>
        <input type="text" id="title" placeholder="Title for pasted text" aria-label="Title for pasted text">
        <textarea id="paste" placeholder="Paste notes, a policy, an FAQ..." aria-label="Pasted text"></textarea>
        <div class="row"><button class="primary" id="addpaste" type="button">Add text</button></div>
        <p class="err-text" id="adderr" role="alert"></p>
      </div>
      <button class="link" id="logout" type="button">Change access key</button>
    </div>
  </details>

  <section class="chat">
    <div>
      <h1>Ask Desk</h1>
      <p class="sub">Answers come from your team's documents. If they don't cover a question, it says so.</p>
    </div>
    <div class="row">
      <label class="label" for="product">Plugin</label>
      <select id="product" aria-label="Plugin to answer about"></select>
      <label class="hint row" style="gap:6px"><input type="checkbox" id="reply" checked> Write as customer reply</label>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <form class="ask" id="form">
      <input type="text" id="q" placeholder="Ask a question" aria-label="Your question" autocomplete="off">
      <button class="primary" id="send" type="submit">Ask</button>
    </form>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "askdesk.key";
  var key = "";
  var busy = false;
  var docs = [];

  try { key = localStorage.getItem(KEY) || ""; } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ---------- API ----------
  async function api(method, path, body) {
    var res = await fetch("/api/" + path, {
      method: method,
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (res.status === 401) { showGate("That access key was not accepted."); throw new Error("auth"); }
    if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ").");
    return data;
  }

  // ---------- access key ----------
  function showGate(msg) {
    $("app").hidden = true; $("gate").hidden = false; $("gateerr").textContent = msg || "";
    $("keyin").focus();
  }
  $("gate").addEventListener("submit", function (e) {
    e.preventDefault();
    key = $("keyin").value.trim(); if (!key) return;
    try { localStorage.setItem(KEY, key); } catch (e2) {}
    start();
  });
  $("logout").onclick = function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    key = ""; $("keyin").value = ""; showGate("");
  };

  // ---------- sources panel ----------
  function selectedPlugin() { return $("product").value; }

  async function refreshDocs() {
    var d = await api("GET", "docs");
    docs = d.docs || [];
    var p = await api("GET", "plugins");
    renderPlugins(p.plugins || []);
    renderDocs();
  }

  function renderPlugins(names) {
    var sel = $("product"), cur = sel.value;
    sel.textContent = "";
    var all = el("option", "", "All plugins"); all.value = ""; sel.appendChild(all);
    names.forEach(function (n) { var o = el("option", "", n); o.value = n; sel.appendChild(o); });
    sel.value = names.indexOf(cur) >= 0 ? cur : "";
    var dl = $("prodlist"); dl.textContent = "";
    names.forEach(function (n) { var o = document.createElement("option"); o.value = n; dl.appendChild(o); });
  }

  function renderDocs() {
    var box = $("docs"); box.textContent = "";
    $("count").textContent = docs.length ? docs.length + (docs.length === 1 ? " document" : " documents") : "";
    if (!docs.length) {
      box.appendChild(el("p", "hint", "No documents yet. Add a file or paste text below and questions will be answered from it."));
      return;
    }
    docs.forEach(function (d) {
      var row = el("div", "doc");
      var info = el("div"); info.style.minWidth = "0";
      info.appendChild(el("b", "", d.title));
      info.appendChild(el("small", "", (d.plugin || "Shared") + (d.kind === "learned" ? " · learned" : "")));
      var rm = el("button", "link", "Remove");
      rm.type = "button";
      rm.setAttribute("aria-label", "Remove " + d.title);
      rm.onclick = async function () {
        try { await api("DELETE", "docs?id=" + encodeURIComponent(d.id)); await refreshDocs(); }
        catch (e) { if (e.message !== "auth") $("adderr").textContent = e.message; }
      };
      row.appendChild(info); row.appendChild(rm); box.appendChild(row);
    });
  }

  async function refreshTop() {
    var q = selectedPlugin() ? "?plugin=" + encodeURIComponent(selectedPlugin()) : "";
    var t = await api("GET", "top" + q);
    var box = $("top"); box.textContent = "";
    var list = t.top || [];
    if (!list.length) box.appendChild(el("p", "hint", "Questions people ask are counted here."));
    list.slice(0, 5).forEach(function (x) {
      var b = el("button", "link", x.text + "  ×" + x.count); b.type = "button";
      b.onclick = function () { $("q").value = x.text; $("form").requestSubmit(); };
      box.appendChild(b);
    });
    var u = await api("GET", "unanswered" + q);
    var ub = $("unans"); ub.textContent = "";
    var ul = u.unanswered || [];
    if (!ul.length) ub.appendChild(el("p", "hint", "Questions with no matching document show here, so you know what to add."));
    ul.slice(0, 5).forEach(function (x) {
      var b = el("button", "link", x.text + (x.count > 1 ? "  ×" + x.count : "")); b.type = "button";
      b.onclick = function () { $("q").value = x.text; };
      ub.appendChild(b);
    });
  }

  async function addDoc(title, text) {
    text = (text || "").trim(); if (!text) return;
    await api("POST", "docs", { title: (title || "").trim() || "Untitled note", plugin: $("prodin").value.trim(), text: text });
  }
  $("addpaste").onclick = async function () {
    $("adderr").textContent = "";
    try {
      await addDoc($("title").value, $("paste").value);
      $("title").value = ""; $("paste").value = "";
      await refreshDocs();
    } catch (e) { if (e.message !== "auth") $("adderr").textContent = e.message; }
  };
  $("file").onchange = async function (e) {
    $("adderr").textContent = "";
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = "";
    for (var i = 0; i < files.length; i++) {
      try { await addDoc(files[i].name, await files[i].text()); }
      catch (err) { if (err.message !== "auth") $("adderr").textContent = files[i].name + ": " + err.message; }
    }
    try { await refreshDocs(); } catch (e2) {}
  };
  $("product").onchange = function () { refreshTop().catch(function () {}); };

  // ---------- chat ----------
  function addMsg(cls) { var m = el("div", "msg " + cls); $("log").appendChild(m); return m; }

  function buildActions(a, body, question, plugin) {
    var act = el("div", "srcs");
    var cp = el("button", "link", "Copy"); cp.type = "button";
    cp.onclick = function () {
      function pick() { var r = document.createRange(); r.selectNodeContents(body); var s = getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent = "Selected. Press Ctrl+C"; }
      try { navigator.clipboard.writeText(body.textContent).then(function () { cp.textContent = "Copied"; }, pick); } catch (e) { pick(); }
    };
    var sv = el("button", "link", "Save as learned answer"); sv.type = "button";
    var fx = el("button", "link", "Correct it"); fx.type = "button";
    async function save(text) {
      try {
        await api("POST", "learn", { question: question, answer: text, plugin: plugin });
        sv.textContent = "Saved. Future questions will use it."; sv.disabled = true;
        await refreshDocs(); refreshTop().catch(function () {});
      } catch (e) { if (e.message !== "auth") sv.textContent = e.message; }
    }
    sv.onclick = function () { save(body.textContent); };
    fx.onclick = function () {
      fx.disabled = true;
      var ta = document.createElement("textarea"); ta.value = body.textContent; ta.setAttribute("aria-label", "Corrected answer");
      var ok = el("button", "primary", "Save correction"); ok.type = "button"; ok.style.marginTop = "6px";
      ok.onclick = function () {
        var v = ta.value.trim(); if (!v) return;
        body.textContent = v; ta.remove(); ok.remove(); save(v);
      };
      a.appendChild(ta); a.appendChild(ok); ta.focus();
    };
    act.appendChild(cp); act.appendChild(sv); act.appendChild(fx);
    return act;
  }

  async function ask(question) {
    if (busy) return; busy = true; $("send").disabled = true; $("suggest").textContent = "";
    $("log").appendChild(el("div", "msg q", question));
    var a = addMsg("a");
    var body = el("div", "body pending", "Checking your documents...");
    a.appendChild(body);
    var plugin = selectedPlugin();
    try {
      var r = await api("POST", "ask", { question: question, plugin: plugin, asReply: $("reply").checked });
      body.className = "body"; body.textContent = r.answer;
      var srcs = el("div", "srcs");
      if (r.sources && r.sources.length) {
        srcs.appendChild(el("span", "label", "From"));
        r.sources.forEach(function (s) { srcs.appendChild(el("span", "chip", s.title)); });
      } else {
        srcs.appendChild(el("span", "chip gen", "No matching document"));
      }
      a.appendChild(srcs);
      a.appendChild(buildActions(a, body, question, plugin));
      refreshTop().catch(function () {});
    } catch (e) {
      if (e.message !== "auth") { body.className = "body err"; body.textContent = e.message; }
    }
    busy = false; $("send").disabled = false;
    a.scrollIntoView({ block: "nearest" });
  }
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("q").value.trim(); if (!v) return;
    $("q").value = ""; ask(v);
  });

  // ---------- start ----------
  async function start() {
    $("gate").hidden = true; $("app").hidden = false;
    if (window.matchMedia && matchMedia("(max-width: 760px)").matches) $("rail").open = false;
    try {
      await refreshDocs();
      await refreshTop();
    } catch (e) { if (e.message !== "auth") $("adderr").textContent = e.message; }
  }
  if (key) start(); else showGate("");
})();
</script>
</body>
</html>
