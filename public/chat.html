<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Desk</title>
<style>
  :root { --accent:#1f6b5a; --bg:#f6f3ee; --panel:#ffffff; --ink:#1c2321; --muted:#6b7672; --line:#e4ded4; }
  @media (prefers-color-scheme: dark) {
    :root { --accent:#5fc2a8; --bg:#151a18; --panel:#1e2422; --ink:#e8eae7; --muted:#8fa19a; --line:#2a332f; }
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  #log:empty::before { content:"Ask anything about the plugins."; margin:auto; color:var(--muted); font-size:15px; }
  .msg { max-width:min(640px, 92%); padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .q { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .a { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .a .copy { display:inline-block; margin-top:8px; font-size:12px; color:var(--accent); background:none; border:1px solid var(--line); border-radius:8px; padding:3px 10px; cursor:pointer; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel); }
  input { flex:1; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); min-width:0; }
  input:focus, button:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:0 18px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .err { color:#b4432e; }
  @media (max-width:760px) { .msg { max-width:96%; } }
</style>
</head>
<body>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask a question…" autocomplete="off" autofocus><button id="send">Ask</button></form>
<script>
const API = location.origin + "/api/ask";
const TEAM_KEY = "urmXalKI1DlM4NL2loLUmMHQgcobZs1";
const log = document.getElementById("log"), f = document.getElementById("f"), q = document.getElementById("q"), send = document.getElementById("send");
function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (cls === "a" && text) {
    const b = document.createElement("button");
    b.className = "copy";
    b.type = "button";
    b.textContent = "Copy reply";
    b.onclick = () => { navigator.clipboard.writeText(text); b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy reply", 1200); };
    d.appendChild(b);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
f.onsubmit = async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  q.value = "";
  add("q", question);
  send.disabled = true;
  const a = add("a", "…");
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + TEAM_KEY },
      body: JSON.stringify({ question, asReply: true }),
    });
    const j = await r.json().catch(() => ({}));
    a.textContent = r.ok && j.answer ? j.answer : "Something went wrong (" + r.status + ").";
  } catch {
    a.textContent = "Network error — check the connection.";
    a.className += " err";
  }
  a.cloneNode(true);
  if (a.textContent !== "…") add("done-hidden", "");
  log.lastChild.remove();
  send.disabled = false;
  q.focus();
};
</script>
</body>
</html>
